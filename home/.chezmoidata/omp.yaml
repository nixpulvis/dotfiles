# omp (oh-my-pi coding agent) release pin for the direct-download install path.
#
# omp isn't in any distro package manager or winget. It only ships as a
# Homebrew tap (macOS/Linux) and GitHub release binaries. macOS uses the tap
# (see packages.yaml `base`). Linux and Windows download the pinned binary below
# in run_once_after_15-install-omp.{sh,ps1}.tmpl. To upgrade, bump `version` and
# copy the checksums from the release's SHA256SUMS.txt. The scripts re-run
# when the version changes.
omp:
  version: "18.12.6"
  sha256:
    linux-x64:   "85d9daf3a05fc76e8cd425ae1904eb576af8d21cc85fcf4690742626e07ccfa4"
    linux-arm64: "eee8e586274cef2e725c218b2b28b48ca9965d46dd58f60998cb347eca4ad0cf"
    windows-x64: "73d73c11dc8821cf939441a964992aefc9c5b0d5a4418e9e8985a46439b60eef"
