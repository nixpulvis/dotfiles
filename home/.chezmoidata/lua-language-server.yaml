# lua-language-server release pin for Linux without pacman (Debian/Ubuntu have
# no package), installed by run_once_after_16-install-lua-language-server.sh.tmpl.
# The other platforms get it as a neovim feature package (features.yaml). To
# upgrade, bump `version` and copy the checksums from the release's asset
# digests (`gh release view <version> -R LuaLS/lua-language-server --json assets`).
# The script re-runs when the pin changes.
