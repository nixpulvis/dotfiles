# Worktrunk (`wt`) user config. Projects are bare repos at <project>/.git with
# a worktree per branch at <project>/<branch> (/ in branch names becomes -).
# For a bare repo {{ repo_path }} is the .git directory itself. A regular clone
# would put its worktrees beside it in the parent directory instead, so clone
# with `git clone --bare <url> <project>/.git` (see worktrunk.dev/tips-patterns),
# or convert an existing clone in place with `wt adopt` (below).
# An {% if %} on repo_path could fall back to <repo>.<branch> there, but wt
# then warns about the path on every switch in a bare repo.
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

[aliases]
# Convert a regular clone at <project> into the layout above: <project>/.git
# becomes the bare repo and the checkout moves to <project>/<branch>, keeping
# staged, unstaged, untracked and ignored files. Then switches to that worktree,
# or runs `wt switch <args>` if given (e.g. `wt adopt -c feature`).
adopt = '''
set -eu
die() { echo "wt adopt: $*" >&2; exit 1; }
common=$(git rev-parse --path-format=absolute --git-common-dir)
top=$(dirname "$common")
[ "$(basename "$common")" = .git ] || die "$common is not a <project>/.git directory"
[ "$(git --git-dir="$common" config --bool core.bare || echo false)" = false ] || die "$top is already a bare layout"
cd "$top"
b=$(git symbolic-ref -q --short HEAD) || die "$top has a detached HEAD"
name=$(printf %s "$b" | tr '/\\' '--')
for f in MERGE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG rebase-merge rebase-apply; do
  [ ! -e ".git/$f" ] || die "finish the in-progress operation first (.git/$f)"
done
[ ! -d .git/modules ] || die "repos with submodules are not supported"

stage=$(mktemp -d "$top/.wt-adopt.XXXXXX")
find . -mindepth 1 -maxdepth 1 ! -name .git ! -name "${stage##*/}" -exec mv {} "$stage"/ \;
git config core.bare true
if ! git worktree add -q --no-checkout "$name" "$b"; then
  git config core.bare false
  find "$stage" -mindepth 1 -maxdepth 1 -exec mv {} . \;
  rmdir "$stage"
  die "git worktree add failed; restored $top"
fi
gd=$(git -C "$name" rev-parse --absolute-git-dir)
[ ! -f .git/index ] || mv .git/index "$gd/index"
find "$stage" -mindepth 1 -maxdepth 1 -exec mv {} "$name"/ \;
rmdir "$stage"

d='{{ default_branch }}'
if [ -n "$d" ] && git show-ref -q --verify "refs/heads/$d"; then
  git symbolic-ref HEAD "refs/heads/$d"
fi
[ "$(git worktree list --porcelain | grep -c '^worktree ')" -le 2 ] ||
  echo "wt adopt: other worktrees are still outside $top; move them with wt step relocate" >&2
{% if args %}wt switch {{ args }}{% else %}wt switch "$b"{% endif %}
'''

# Check out a GitHub PR through a named remote for its head repo (added if
# missing, named after the lowercased owner) so the branch tracks
# <remote>/<branch> like any other. An existing local branch with no upstream
# gets one; one tracking something else is refused. Then switches to it.
pr = '''
set -eu
die() { echo "wt pr: $*" >&2; exit 1; }
n='{{ args }}'
[ -n "$n" ] || die "usage: wt pr <number>"
info=$(gh pr view "$n" --json headRepository,headRefName --jq '"\(.headRepository.nameWithOwner) \(.headRefName)"')
repo=${info% *}
branch=${info#* }
url="https://github.com/$repo.git"
remote=$(git remote -v | awk -v u="$url" '$2 == u && $3 == "(fetch)" { print $1; exit }')
if [ -z "$remote" ]; then
  remote=$(printf %s "${repo%%/*}" | tr '[:upper:]' '[:lower:]')
  git remote add "$remote" "$url"
fi
git fetch "$remote" "+refs/heads/$branch:refs/remotes/$remote/$branch"
if git show-ref -q --verify "refs/heads/$branch"; then
  up=$(git for-each-ref --format='%(upstream:short)' "refs/heads/$branch")
  if [ -z "$up" ]; then
    git branch -u "$remote/$branch" "$branch"
  elif [ "$up" != "$remote/$branch" ]; then
    die "local $branch already tracks $up, not $remote/$branch"
  fi
else
  git branch --track "$branch" "$remote/$branch"
fi
wt switch "$branch"
'''

# wt list with Base and Base…± (below) in place of main↕ and main…±.
list-base = '''
wt --config-set 'list.columns=["branch", "status", "working-diff", "Base", "Base…±", "upstream", "Tracking", "ci", "commit", "age"]' list {{ args }}
'''

[list]
columns = ["branch", "status", "working-diff", "ahead-behind", "branch-diff", "upstream", "Tracking", "ci", "commit", "age"]

# Base and Base…± stand in for main↕ and main…± in wt list-base, measured
# against each branch's base instead of the default branch: commits
# ahead/behind then the base's name, and lines changed since the fork point.
# They read branch.<name>.base, .baseahead, .basebehind, .baseadded, and
# .basedeleted, which ~/.config/worktrunk/record-base keeps current as a global
# git reference-transaction hook (hook.wt-base in ~/.gitconfig).
[list.custom-columns.Base]
template = '{% if git.branch.base %}{% set a = git.branch.baseahead | default("") | string %}{% set b = git.branch.basebehind | default("") | string %}{% if a not in ["", "0"] %}↑{{ a }} {% endif %}{% if b not in ["", "0"] %}↓{{ b }} {% endif %}{{ git.branch.base }}{% endif %}'

[list.custom-columns."Base…±"]
template = '{% set a = git.branch.baseadded | default("") | string %}{% set d = git.branch.basedeleted | default("") | string %}{% set a = "" if a == "0" else a %}{% set d = "" if d == "0" else d %}{% if a %}+{{ a }}{% endif %}{% if a and d %} {% endif %}{% if d %}-{{ d }}{% endif %}'

[list.custom-columns.Tracking]
template = '{{ git.branch.remote }}/{{ git.branch.merge | replace("refs/heads/", "") }}'
