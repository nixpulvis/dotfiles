[general]
import = ["nixpulvis-indexed.toml"]

[colors.bright]
# Bright black is the conventional "muted gray" for de-emphasized text: fish
# autosuggestions, vim comments, eza's dashes. Keep it readable on the
# background; same gray as index 242.
black = "#808080"
blue = "#64B3FE"
cyan = "#A2F9FE"
green = "#54E53E"
magenta = "#FE99E6"
red = "#FE562E"
white = "#FFFFFF"
yellow = "#FD9805"

[colors.dim]
black = "#000000"
blue = "#1774CA"
cyan = "#0AAFB1"
green = "#099301"
magenta = "#CC31B0"
red = "#C70107"
white = "#AAAAAA"
yellow = "#D06206"

[colors.hints.end]
background = "CellForeground"
foreground = "CellBackground"

[colors.hints.start]
background = "CellForeground"
foreground = "CellBackground"

[colors.line_indicator]
background = "#FD9805"

[colors.normal]
black = "#000000"
blue = "#00A3FE"
cyan = "#03F0FB"
green = "#2CC81B"
magenta = "#FE66DF"
red = "#FE340A"
white = "#FFFFFF"
yellow = "#FF8000"

[colors.primary]
background = "#161616"
foreground = "#CACACA"

[colors.search.matches]
background = "#FFFFFF"
foreground = "#FE340A"
