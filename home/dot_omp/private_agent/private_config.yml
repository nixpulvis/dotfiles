providers:
  webSearchOrder:
    []
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-4-8
symbolPreset: ascii
composer:
  shape: rail
theme:
  dark: titanium-me
  light: light
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
doubleEscapeAction: branch
emojiAutocomplete: false
paste:
  largeMenuThreshold: 0
error:
  notify: "on"
proseOnlyThinking: true
hideThinkingBlock: true
statusLine:
  preset: custom
  sessionAccent: true
  separator: block
  # Default preset's segments, plus a `usage` segment on the right that shows
  # the Claude subscription rate-limit windows: 5h (rolling session) and 7d
  # (weekly), each as "<pct>% (<reset>)".
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
  rightSegments:
    - usage
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
display:
  shimmer: kitt
  showTokenUsage: true